<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Decorative Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#gold)" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Diya / Oil Lamp Base -->
  <path d="M18 37 C18 45, 46 45, 46 37 C46 36, 44 35, 32 35 C20 35, 18 36, 18 37 Z" fill="url(#gold)"/>
  
  <!-- Diya Stand / Pedestal -->
  <path d="M28 43 L36 43 L38 48 L26 48 Z" fill="url(#gold)"/>
  
  <!-- Outer Flame Glow -->
  <path d="M32 14 C35 21, 39 26, 39 31 C39 35, 36 37, 32 37 C28 37, 25 35, 25 31 C25 26, 29 21, 32 14 Z" fill="#f97316" opacity="0.85" filter="url(#glow)"/>
  
  <!-- Inner Flame (Golden / Bright) -->
  <path d="M32 18 C34 23, 36 27, 36 31 C36 34, 34 35.5, 32 35.5 C30 35.5, 28 34, 28 31 C28 27, 30 23, 32 18 Z" fill="#fef08a"/>

  <!-- Kalasam / Auspicious Accent Dots -->
  <circle cx="32" cy="11" r="1.5" fill="#fef08a"/>
</svg>

